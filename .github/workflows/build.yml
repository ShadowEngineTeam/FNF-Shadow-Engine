name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      assetType:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string
    secrets:
      SE_KEYSTORE_FILE:
        required: false
      SE_KEYSTORE_INFO_FILE:
        required: false

env:
  HAXE_VERSION: 4.3.7
  NDK_TAG: "r30"
  NDK_VERSION: ""
  SDK_VERSION: "37.0.0"
  PROJECT_NAME: ShadowEngine

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: true

      - name: Setup Haxe
        uses: ShadowEngineTeam/setup-haxe@main
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Dependencies for Linux
        if: ${{ startsWith(inputs.name, 'Linux') }}
        shell: bash
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-23 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          case "${{ inputs.name }}" in
            "Linux i686")
              sudo dpkg --add-architecture i386
              sudo apt update
              sudo apt install -y clang-23 lld-23 gcc-12-i686-linux-gnu g++-12-i686-linux-gnu libvlc-dev:i386 libvlccore-dev:i386
              ;;
            "Linux ARMV7")
              sudo dpkg --add-architecture armhf
              sudo apt update
              sudo apt install -y clang-23 lld-23 gcc-12-arm-linux-gnueabihf g++-12-arm-linux-gnueabihf libvlc-dev:armhf libvlccore-dev:armhf
              ;;
            "Linux x86_64"|"Linux ARM64")
              sudo apt update
              sudo apt install -y clang-23 lld-23 gcc-12 g++-12 libvlc-dev libvlccore-dev
              ;;
          esac

      - name: Install Libraries
        shell: bash
        run: |
          haxelib git hmm https://github.com/ShadowEngineTeam/hmm --skip-dependencies --quiet
          haxelib run hmm install --quiet

      - name: Setup Android NDK & SDK
        if: ${{ inputs.name == 'Android' }}
        shell: bash
        run: |
          set -euo pipefail

          detect_host() {
            local os arch libc="${NDK_LIBC:-gnu}"

            case "$(uname -m | tr '[:upper:]' '[:lower:]')" in
              x86_64|amd64)              arch=x86_64 ;;
              i386|i486|i586|i686|x86)   arch=i686 ;;
              aarch64|arm64)             arch=aarch64 ;;
              armv7*|armv8l|armhf)       arch=armv7 ;;
              *) echo "Unsupported arch: $(uname -m)" >&2; return 1 ;;
            esac

            case "$(uname -s)" in
              Linux)
                if [ "$(uname -o 2>/dev/null)" = "Android" ]; then os=android; else os=linux; fi ;;
              Darwin) os=macos ;;
              MINGW*|MSYS*|CYGWIN*) os=windows ;;
              *) echo "Unsupported OS: $(uname -s)" >&2; return 1 ;;
            esac

            case "$os-$arch" in
              linux-x86_64)    echo "x86_64-linux-$libc" ;;
              linux-i686)      echo "x86-linux-$libc" ;;
              linux-aarch64)   echo "aarch64-linux-$libc" ;;
              linux-armv7)     echo "arm-linux-${libc}eabihf" ;;
              android-x86_64)  echo "x86_64-linux-android" ;;
              android-i686)    echo "i686-linux-android" ;;
              android-aarch64) echo "aarch64-linux-android" ;;
              android-armv7)   echo "armv7a-linux-androideabi" ;;
              macos-x86_64)    echo "x86_64-apple-darwin" ;;
              macos-aarch64)   echo "arm64e-apple-darwin" ;;
              windows-x86_64)  echo "x86_64-w64-mingw32" ;;
              windows-i686)    echo "i686-w64-mingw32" ;;
              windows-aarch64) echo "aarch64-w64-mingw32" ;;
              *) echo "No NDK variant for $os-$arch" >&2; return 1 ;;
            esac
          }

          HOST="${ANDROID_HOST:-$(detect_host)}"
          case "$HOST" in *w64-mingw32) EXT=7z ;; *) EXT=tar.xz ;; esac

          BASE=https://github.com/HomuHomu833
          NDK_URL="$BASE/android-ndk-custom/releases/download/${NDK_TAG}/android-ndk-${NDK_TAG}${NDK_VERSION}-${HOST}.${EXT}"
          SDK_URL="$BASE/android-sdk-custom/releases/download/${SDK_VERSION}/android-sdk-${SDK_VERSION}-${HOST}.${EXT}"

          echo $SDK_URL
          echo $NDK_URL

          ROOT="$HOME/android"
          mkdir -p "$ROOT/ndk" "$ROOT/sdk"

          download_and_extract() {
            local name="$1"
            local url="$2"
            local destination="$ROOT/$name"
            local archive="$RUNNER_TEMP/$name.$EXT"
            local extract="$RUNNER_TEMP/$name-extract"

            curl -fsSL --retry 3 -o "$archive" "$url"

            if [ "$EXT" = "7z" ]; then
              mkdir -p "$extract"
              7z x -y "-o$extract" "$archive" > /dev/null

              local -a entries=("$extract"/*)
              if [ "${#entries[@]}" -ne 1 ] || [ ! -d "${entries[0]}" ]; then
                echo "Unexpected $name archive structure" >&2
                return 1
              fi

              cp -a "${entries[0]}/." "$destination/"
            else
              tar -xJf "$archive" -C "$destination" --strip-components=1
            fi

            rm -rf "$archive" "$extract"
          }

          download_and_extract ndk "$NDK_URL"
          download_and_extract sdk "$SDK_URL"

          # windows runners need native-style paths
          if command -v cygpath >/dev/null 2>&1; then
            ROOT="$(cygpath -m "$ROOT")"
          fi

          {
            echo "ANDROID_HOME=$ROOT/sdk"
            echo "ANDROID_NDK_HOME=$ROOT/ndk"
          } >> "$GITHUB_ENV"

      - name: Configure Android
        if: ${{ inputs.name == 'Android' }}
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_25_arm64
          haxelib run lime config ANDROID_SETUP true

      - name: Extract Android keystore
        if: ${{ inputs.name == 'Android' && github.repository_owner == 'ShadowEngineTeam' }}
        shell: bash
        env:
          SE_KEYSTORE_FILE: ${{ secrets.SE_KEYSTORE_FILE }}
          SE_KEYSTORE_INFO_FILE: ${{ secrets.SE_KEYSTORE_INFO_FILE }}
        run: |
          echo "$SE_KEYSTORE_FILE" | base64 --decode > keystore/android/key.keystore
          echo "$SE_KEYSTORE_INFO_FILE" | base64 --decode > keystore/android/keystore.json

      - name: Compile
        shell: bash
        run: |
          case "${{ inputs.name }}" in
            "Linux ARMV7")
              CC="clang-23 --target=arm-linux-gnueabihf" CXX="clang++-23 --target=arm-linux-gnueabihf" HXCPP_USE_LD="lld-23" linux32 haxelib run lime build ${{ inputs.buildArgs }} -D ${{ inputs.assetType }}
              ;;
            "Linux i686")
              CC="clang-23 --target=i686-linux-gnu" CXX="clang++-23 --target=i686-linux-gnu" HXCPP_USE_LD="lld-23" linux32 haxelib run lime build ${{ inputs.buildArgs }} -D ${{ inputs.assetType }}
              ;;
            "Linux x86_64"|"Linux ARM64")
              CC="clang-23" CXX="clang++-23" HXCPP_USE_LD="lld-23" haxelib run lime build ${{ inputs.buildArgs }} -D ${{ inputs.assetType }}
              ;;
            *)
              haxelib run lime build ${{ inputs.buildArgs }} -D ${{ inputs.assetType }}
              ;;
          esac

      - name: Make IPA
        if: startsWith(inputs.name, 'iOS')
        shell: bash
        run: |
          # https://github.com/actions/runner-images/issues/14232
          brew trust aws/tap

          brew install ldid
          for config in Debug-iphoneos Debug-iphonesimulator Release-iphoneos Release-iphonesimulator; do
            if [ ! -d "export/release/ios/build/$config" ]; then
              continue
            fi
            cd "export/release/ios/build/$config/${{ env.PROJECT_NAME }}.app"
            if [ -d Frameworks ]; then
              for fw in Frameworks/*.framework; do
                name=$(basename "$fw" .framework)
                if [ -f "$fw/$name" ]; then
                  ldid -S "$fw/$name"
                fi
              done
            fi
            ldid -S../../../${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.entitlements ${{ env.PROJECT_NAME }}
            if [ -d Frameworks ]; then
              for fw in Frameworks/*.framework; do
                name=$(basename "$fw" .framework)
                if [ -f "$fw/$name" ]; then
                  echo "== entitlements: $name =="
                  ldid -e "$fw/$name"
                  echo "========================="
                fi
              done
            fi
            echo "== entitlements: ${{ env.PROJECT_NAME }} =="
            ldid -e ${{ env.PROJECT_NAME }}
            echo "========================="
            cd ..
            mkdir Payload
            mv ${{ env.PROJECT_NAME }}.app Payload
            zip -r ${{ env.PROJECT_NAME }}.ipa Payload
            rm -rf Payload
            cd ../../../../../..
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.artifactName }}-${{ inputs.assetType }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
